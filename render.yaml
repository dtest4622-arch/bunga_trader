services:
  # Main FastAPI Backend
  - type: web
    name: bunga-trader-api
    env: python
    region: oregon
    branch: main
    buildCommand: cd backend && python -m pip install --upgrade pip && python -m pip install -r requirements.txt
    startCommand: cd backend && python serve.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      # DATABASE_URL will be set when you connect PostgreSQL database
      # REDIS_URL optional for now (can add later)
    healthCheckPath: /health
    autoDeploy: true

# Note: Create PostgreSQL database separately in Render dashboard
# Then connect it to this service to get DATABASE_URL automatically injected
