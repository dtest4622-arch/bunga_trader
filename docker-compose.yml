version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: bunga_postgres
    environment:
      POSTGRES_USER: bunga_trader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bunga_secure_password}
      POSTGRES_DB: bunga_trader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bunga_trader"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - bunga_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: bunga_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - bunga_network

  # FastAPI Backend
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bunga_api
    environment:
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - DATABASE_URL=postgresql+asyncpg://bunga_trader:${DB_PASSWORD:-bunga_secure_password}@postgres/bunga_trader
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - MPESA_CONSUMER_KEY=${MPESA_CONSUMER_KEY}
      - MPESA_CONSUMER_SECRET=${MPESA_CONSUMER_SECRET}
      - MPESA_PASSKEY=${MPESA_PASSKEY}
      - MPESA_SHORTCODE=${MPESA_SHORTCODE:-174379}
      - MPESA_ENV=${MPESA_ENV:-sandbox}
      - MT5_HOST=${MT5_HOST:-host.docker.internal}
      - MT5_PORT=${MT5_PORT:-5555}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - bunga_network
    restart: unless-stopped

  # Celery Worker
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bunga_worker
    environment:
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - DATABASE_URL=postgresql+asyncpg://bunga_trader:${DB_PASSWORD:-bunga_secure_password}@postgres/bunga_trader
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY}
      - MT5_HOST=${MT5_HOST:-host.docker.internal}
      - MT5_PORT=${MT5_PORT:-5555}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: celery -A app.services.celery_app:celery_app worker --loglevel=info
    networks:
      - bunga_network
    restart: unless-stopped

  # Celery Beat Scheduler
  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bunga_scheduler
    environment:
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - DATABASE_URL=postgresql+asyncpg://bunga_trader:${DB_PASSWORD:-bunga_secure_password}@postgres/bunga_trader
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/__pycache__
    command: celery -A app.services.celery_app:celery_app beat --loglevel=info
    networks:
      - bunga_network
    restart: unless-stopped

  # Nginx Reverse Proxy (optional)
  nginx:
    image: nginx:alpine
    container_name: bunga_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
    networks:
      - bunga_network
    restart: unless-stopped
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:

networks:
  bunga_network:
    driver: bridge
